  "/api/v1/orders/{order_id}/payments":
    post:
      summary: Process payment
      tags:
      - Payments
      security:
      - bearerAuth: []
      parameters:
      - name: order_id
        in: path
        format: uuid
        required: true
        description: Order ID
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: false
        description: Unique key used to safely retry payment requests
        schema:
          type: string
      responses:
        '200':
          description: payment processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      payment:
                        type: object
                        properties:
                          id:
                            type: integer
                          order_id:
                            type: string
                            format: uuid
                          amount:
                            type: string
                          currency:
                            type: string
                          status:
                            type: string
                          gateway:
                            type: string
                          gateway_transaction_id:
                            type: string
                          paid_at:
                            type: string
                            format: date-time
                            nullable: true
                  errors:
                    type: array
        '401':
          description: authentication failed
        '403':
          description: authorization failed
        '422':
          description: payment gateway rejected the payment
  "/api/v1/payments/webhook":
    post:
      summary: Process Razorpay webhook
      tags:
      - Payments Webhook
      parameters:
      - name: X-Razorpay-Signature
        in: header
        required: true
        description: Razorpay webhook signature
        schema:
          type: string
      - name: X-Razorpay-Event-Id
        in: header
        required: false
        description: Unique Razorpay webhook event ID
        schema:
          type: string
      responses:
        '200':
          description: webhook processed successfully
        '401':
          description: invalid webhook signature
        '422':
          description: webhook event ID is required
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                  example: payment.captured
                payload:
                  type: object
                  properties:
                    payment:
                      type: object
                      properties:
                        entity:
                          type: object
                          properties:
                            id:
                              type: string
                              example: pay_123
                            status:
                              type: string
                              example: captured
                            error_code:
                              type: string
                              nullable: true
                              example: card_declined
                            error_description:
                              type: string
                              nullable: true
                              example: Card was declined
              required:
              - event
              - payload
        required: true
  "/api/v1/products":
    get:
      summary: List products
      tags:
      - Products
      security:
      - bearerAuth: []
      parameters:
      - name: category_id
        in: query
        format: uuid
        required: false
        description: Filter products by category
        schema:
          type: string
      - name: search
        in: query
        required: false
        description: Search products by name or description
        schema:
          type: string
      - name: min_price
        in: query
        format: float
        required: false
        description: Minimum product price
        schema:
          type: number
      - name: max_price
        in: query
        format: float
        required: false
        description: Maximum product price
        schema:
          type: number
      - name: status
        in: query
        required: false
        enum:
        - active
        - inactive
        description: "Filter products by status:\n * `active` \n * `inactive` \n "
        schema:
          type: string
      - name: sort_by
        in: query
        required: false
        enum:
        - name
        - price
        - created_at
        description: Field used for sorting
        schema:
          type: string
      - name: sort_order
        in: query
        required: false
        enum:
        - asc
        - desc
        description: Sort direction
        schema:
          type: string
      - name: page
        in: query
        required: false
        default: 1
        description: Page number
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        default: 20
        maximum: 100
        description: Number of products per page
        schema:
          type: integer
      responses:
        '200':
          description: products fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      products:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            name:
                              type: string
                            slug:
                              type: string
                            description:
                              type: string
                              nullable: true
                            price:
                              type: string
                            status:
                              type: string
                              enum:
                              - active
                              - inactive
                            category_id:
                              type: string
                              format: uuid
                            created_at:
                              type: string
                              format: date-time
                            updated_at:
                              type: string
                              format: date-time
                            category:
                              type: object
                              properties:
                                id:
                                  type: string
                                  format: uuid
                                name:
                                  type: string
                                slug:
                                  type: string
                      meta:
                        type: object
                        properties:
                          page:
                            type: integer
                          per_page:
                            type: integer
                          total:
                            type: integer
                          total_pages:
                            type: integer
                  errors:
                    type: array
        '401':
          description: authentication failed
        '403':
          description: authorization failed
        '422':
          description: invalid product status
    post:
      summary: Create product
      tags:
      - Products
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: product created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      product:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          name:
                            type: string
                          slug:
                            type: string
                          description:
                            type: string
                            nullable: true
                          price:
                            type: string
                          status:
                            type: string
                          category_id:
                            type: string
                            format: uuid
                          created_at:
                            type: string
                            format: date-time
                          updated_at:
                            type: string
                            format: date-time
                  errors:
                    type: array
        '401':
          description: authentication failed
        '403':
          description: authorization failed
        '422':
          description: invalid product
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                product:
                  type: object
                  properties:
                    name:
                      type: string
                      example: MacBook Pro
                    slug:
                      type: string
                      example: macbook-pro
                    description:
                      type: string
                      nullable: true
                      example: Professional laptop.
                    price:
                      type: string
                      example: '1999.99'
                    status:
                      type: string
                      enum:
                      - active
                      - inactive
                      example: active
                    category_id:
                      type: string
                      format: uuid
                      example: 0e3edee2-6226-4a68-bb72-b9d4442b681f
                  required:
                  - name
                  - slug
                  - price
                  - status
                  - category_id
              required:
              - product
        required: true
  "/api/v1/products/{id}":
    get:
      summary: Get product
