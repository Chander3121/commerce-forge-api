---
openapi: 3.0.1
info:
  title: Commerce Forge API
  version: v1
  description: Commerce Forge REST API
paths:
  "/api/v1/auth/me":
    get:
      summary: Get current authenticated user
      tags:
      - Authentication
      security:
      - bearerAuth: []
      responses:
        '200':
          description: authenticated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          email:
                            type: string
                            format: email
                  errors:
                    type: array
        '401':
          description: authentication failed
  "/api/v1/auth/login":
    post:
      summary: Login user
      tags:
      - Authentication
      parameters: []
      responses:
        '200':
          description: login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          email:
                            type: string
                            format: email
                  errors:
                    type: array
        '401':
          description: authentication failed
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                      format: email
                      example: test@commerceforge.dev
                    password:
                      type: string
                      format: password
                      example: Password@123
                  required:
                  - email
                  - password
              required:
              - user
        required: true
  "/api/v1/auth/logout":
    delete:
      summary: Logout user
      tags:
      - Authentication
      security:
      - bearerAuth: []
      responses:
        '200':
          description: logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                  errors:
                    type: array
  "/api/v1/categories":
    get:
      summary: List categories
      tags:
      - Categories
      security:
      - bearerAuth: []
      responses:
        '200':
          description: categories fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      categories:
                        type: array
                        items:
                          type: object
                  errors:
                    type: array
        '401':
          description: authentication failed
        '403':
          description: authorization failed
    post:
      summary: Create category
      tags:
      - Categories
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: category created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      category:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          name:
                            type: string
                          slug:
                            type: string
                          description:
                            type: string
                            nullable: true
                          created_at:
                            type: string
                            format: date-time
                          updated_at:
                            type: string
                            format: date-time
                  errors:
                    type: array
        '401':
          description: authentication failed
        '403':
          description: authorization failed
        '422':
          description: category could not be created
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                category:
                  type: object
                  properties:
                    name:
                      type: string
                      example: Electronics
                    slug:
                      type: string
                      example: electronics
                    description:
                      type: string
                      nullable: true
                      example: Electronic products
                  required:
                  - name
                  - slug
              required:
              - category
        required: true
  "/api/v1/categories/{id}":
    get:
      summary: Get category
      tags:
      - Categories
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        format: uuid
        required: true
        description: Category ID
        schema:
          type: string
      responses:
        '200':
          description: category fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      category:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          name:
                            type: string
                          slug:
                            type: string
                          description:
                            type: string
                            nullable: true
                          created_at:
                            type: string
                            format: date-time
                          updated_at:
                            type: string
                            format: date-time
                  errors:
                    type: array
        '401':
          description: authentication failed
        '403':
          description: authorization failed
        '404':
          description: category not found
    patch:
      summary: Update category
      tags:
      - Categories
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        format: uuid
        required: true
        description: Category ID
        schema:
          type: string
      responses:
        '200':
          description: category updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      category:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          name:
                            type: string
                          slug:
                            type: string
                          description:
                            type: string
                            nullable: true
                          created_at:
                            type: string
                            format: date-time
                          updated_at:
                            type: string
                            format: date-time
                  errors:
                    type: array
        '401':
          description: authentication failed
        '403':
          description: authorization failed
        '422':
          description: category could not be updated
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                category:
                  type: object
                  properties:
                    name:
                      type: string
                      example: Updated Electronics
                    slug:
                      type: string
                      example: updated-electronics
                    description:
                      type: string
                      nullable: true
                      example: Updated category description.
              required:
              - category
        required: true
    delete:
      summary: Delete category
      tags:
      - Categories
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        format: uuid
        required: true
        description: Category ID
        schema:
          type: string
      responses:
        '200':
          description: category deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                  errors:
                    type: array
        '401':
          description: authentication failed
        '403':
          description: authorization failed
        '422':
          description: category could not be deleted
  "/api/v1/customers":
    get:
      summary: List customers
      tags:
      - Customers
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        required: false
        default: 1
        description: Page number
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        default: 20
        maximum: 100
        description: Number of customers per page
        schema:
          type: integer
      - name: sort_by
        in: query
        required: false
        default: created_at
        enum:
        - name
        - email
        - phone
        - created_at
        description: "Field used for sorting:\n * `name` \n * `email` \n * `phone`
          \n * `created_at` \n "
        schema:
          type: string
      - name: sort_order
        in: query
        required: false
        default: desc
        enum:
        - asc
        - desc
        description: Sort direction
        schema:
          type: string
      - name: search
        in: query
        required: false
        description: Search customers by name, email or phone
        schema:
          type: string
      responses:
        '200':
          description: customers fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      customers:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            name:
                              type: string
                            email:
                              type: string
                              format: email
                            phone:
                              type: string
                              nullable: true
                            created_at:
                              type: string
                              format: date-time
                      meta:
                        type: object
                        properties:
                          page:
                            type: integer
                          per_page:
                            type: integer
                          total:
                            type: integer
                          total_pages:
                            type: integer
                  errors:
                    type: array
        '401':
          description: authentication failed
        '403':
          description: authorization failed
