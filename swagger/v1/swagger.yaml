    post:
      summary: Create order
      tags:
      - Orders
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: order created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      order:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          user_id:
                            type: string
                            format: uuid
                          customer_id:
                            type: string
                            format: uuid
                          status:
                            type: string
                          subtotal:
                            type: string
                          total:
                            type: string
                          currency:
                            type: string
                          created_at:
                            type: string
                            format: date-time
                          updated_at:
                            type: string
                            format: date-time
                  errors:
                    type: array
        '401':
          description: authentication failed
        '403':
          description: authorization failed
        '422':
          description: invalid order
        '404':
          description: product not found
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                order:
                  type: object
                  properties:
                    customer_id:
                      type: string
                      format: uuid
                      example: 0e3edee2-6226-4a68-bb72-b9d4442b681f
                    items:
                      type: array
                      items:
                        type: object
                        properties:
                          product_id:
                            type: string
                            format: uuid
                            example: 1f4edee2-6226-4a68-bb72-b9d4442b681f
                          quantity:
                            type: integer
                            example: 2
                        required:
                        - product_id
                        - quantity
                  required:
                  - customer_id
                  - items
              required:
              - order
        required: true
