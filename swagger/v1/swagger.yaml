  "/api/v1/customers/{id}/orders":
    get:
      summary: List customer orders
      tags:
      - Customers
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        format: uuid
        required: true
        description: Customer ID
        schema:
          type: string
      responses:
        '200':
          description: customer orders fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      orders:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            user_id:
                              type: string
                              format: uuid
                            customer_id:
                              type: string
                              format: uuid
                            status:
                              type: string
                            subtotal:
                              type: string
                            total:
                              type: string
                            currency:
                              type: string
                            created_at:
                              type: string
                              format: date-time
                            order_items:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                    format: uuid
                                  product_id:
                                    type: string
                                    format: uuid
                                  quantity:
                                    type: integer
                                  unit_price:
                                    type: string
                                  total_price:
                                    type: string
                  errors:
                    type: array
        '401':
          description: authentication failed
        '403':
          description: authorization failed
        '404':
          description: customer not found
